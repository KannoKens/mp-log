name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 依存を固定しているぶん、放っておくと壊れていることに気づけない。
  # 週1で回して「今の PyPI で入る依存で通るか」を見る。
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 手元の venv と同じ 3.12 に固定する。db.py は `str | None` を
          # 実行時に評価する注釈で使っているので 3.10 未満では動かない。
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: 依存をインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: テスト
        run: pytest

      - name: アプリが実際に起動するか
        # pytest の TestClient は startup イベントを通るが、uvicorn 越しの
        # 起動（systemd から動かす形）までは見ていない。import できるだけの
        # 状態と「サーバとして応答する」状態は別なので、ここで1回叩く。
        run: |
          python -m uvicorn main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/ > /dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/ > /dev/null
          curl -fsS http://127.0.0.1:8000/calendar > /dev/null
          curl -fsS http://127.0.0.1:8000/insights > /dev/null
          curl -fsS http://127.0.0.1:8000/api/logs > /dev/null

      - name: リマインダが依存なしで動くか
        # systemd の timer は venv を通さずシステムの python3 で叩くので、
        # remind.py は「標準ライブラリのみ」でなければならない（docstring の約束）。
        # fastapi を入れた環境で動かしても、この約束は検証できない。
        run: |
          python -m venv /tmp/bare-venv
          /tmp/bare-venv/bin/python -c "import db; db.init_db()"
          /tmp/bare-venv/bin/python remind.py --terminal
          rm -f mplog.db
